{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Sign in" %}{% endblock %}
{% block content %}
<section class="card" style="max-width:460px;margin:0 auto;">
  <h2>{% trans "Sign in" %}</h2>
  <p class="muted">{% trans "Use the email address you registered with." %}</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">{% trans "Continue" %}</button>
  </form>
  <p class="muted">{% trans "No account yet?" %} <a href="{% url 'accounts:register' %}">{% trans "Register" %}</a></p>
</section>
{% endblock %}
